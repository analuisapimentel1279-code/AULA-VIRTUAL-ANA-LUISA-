<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula Virtual · Sector 04</title><style>
:root{--blue:#153f59;--green:#327b6d;--gold:#bd913d;--bg:#f3f6f6;--ink:#203d4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 18px;background:var(--blue);color:white}button:hover{filter:brightness(1.15)}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.light{background:#e7efed;color:var(--blue)}.gold{background:var(--gold)}header{background:white;border-bottom:1px solid #dde6e7;padding:17px 4%;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:750;letter-spacing:1px}.tag{color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:2px}.layout{display:grid;grid-template-columns:240px 1fr;min-height:85vh}aside{padding:30px 20px;background:var(--blue);color:white}aside button{width:100%;text-align:left;margin:4px 0;background:transparent}aside button.active{background:#ffffff20;border-left:3px solid #d4b465}aside small{color:#bbd1da}main{padding:34px 5%;max-width:1400px;width:100%;margin:auto}h1{font-size:clamp(28px,3.3vw,46px);line-height:1.2;letter-spacing:-1px;margin:15px 0}h2{line-height:1.3;font-size:25px}h3{line-height:1.4;margin-top:0}.muted{color:#6a7c83}.hero{background:var(--blue);color:white;padding:36px;border-radius:18px;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center}.hero p{color:#dae5e8}.hero svg{width:100%;max-height:260px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:22px 0}.card{background:white;border:1px solid #e1e9e7;border-radius:14px;padding:24px;box-shadow:0 6px 20px #193c4b04}.card p{color:#62777e}.module{display:flex;flex-direction:column;align-items:flex-start}.module button{margin-top:auto}.module .num{font-size:12px;color:var(--green);letter-spacing:2px;margin-bottom:14px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.bar{height:8px;background:#dce8e4;border-radius:8px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}.pill{display:inline-block;padding:4px 10px;border-radius:20px;background:#e8f3ed;color:#26705c;font-size:12px}.notice{border-left:4px solid var(--gold);background:#fbf7ed;padding:14px 20px;border-radius:5px;margin:18px 0}.two{display:grid;grid-template-columns:2fr 1fr;gap:24px}.stack>*{margin-bottom:20px}textarea,input,select{width:100%;padding:12px;border:1px solid #bdcecf;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:110px}label{display:block;margin:14px 0 7px}fieldset{border:1px solid #dce7e5;border-radius:10px;margin:18px 0;padding:18px}fieldset label{cursor:pointer;display:flex;align-items:center;gap:10px}input[type=radio]{width:auto}.feedback{background:#edf4f0;padding:14px;border-radius:8px;margin:12px 0}.wrong{background:#fff1e9}dialog{border:0;border-radius:16px;max-width:650px;width:92%;padding:30px;color:var(--ink)}dialog::backdrop{background:#112f43aa}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:14px;border-bottom:1px solid #e2e9e9}.tablewrap{overflow:auto}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:10px 2px;text-align:center;border-radius:6px;background:#f2f6f5}.event{background:#d7eae2;border:1px solid #6d9e8d}.badge{font-size:40px}.footer{font-size:12px;color:#71858b;text-align:center;padding:25px}.welcome{max-width:1100px;margin:auto}.welcome .hero{min-height:420px}.checks{white-space:pre-wrap}.comment{border-bottom:1px solid #e1e9e7;padding:15px 0}.profile{padding:28px;border:1px solid #dce7e5;border-radius:12px;margin:15px 0}.quizresult{font-weight:600}#toast{position:fixed;bottom:25px;right:25px;background:var(--blue);color:white;padding:14px 22px;border-radius:10px;z-index:10;display:none}.videobox{background:#153f59;color:white;padding:35px;border-radius:10px;text-align:center}.stats strong{display:block;font-size:32px;color:var(--blue)}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.layout{grid-template-columns:190px 1fr}.hero{grid-template-columns:1fr}.hero svg{max-height:180px}}@media(max-width:650px){header{flex-wrap:wrap}.layout{display:block}aside{padding:10px;display:flex;overflow:auto;gap:3px}aside button{width:auto;white-space:nowrap}aside small,aside .sideinfo{display:none}main{padding:22px 16px}.grid{grid-template-columns:1fr}.hero{padding:25px}.welcome .hero{min-height:0}h1{font-size:30px}td,th{padding:8px}}
</style><body><header><div><div class="brand">✦ AULA VIRTUAL <span style="color:#bd913d">/</span> SECTOR 04</div><div class="tag">Preescolar · Huamantla, Tlaxcala</div></div><div class="row"><span class="pill">Demostración académica</span><button class="light" onclick="notifications()" aria-label="Notificaciones">♧ Avisos</button><button class="light" onclick="login()">Cambiar perfil</button></div></header><div id="app"></div><dialog id="modal"><div id="modalbody"></div><button class="light" onclick="document.querySelector('dialog').close()">Cerrar ventana</button></dialog><div id="toast" role="status"></div><script>
const titles=['Bienvenida y diagnóstico','Identidad profesional y principios éticos','Conocimiento de las escuelas y su contexto','Acompañamiento pedagógico y mejora educativa','Trabajo colaborativo y comunidad','Proyecto integrador'];
const desc=['Reconoce tu punto de partida y traza tu ruta de aprendizaje.','Reflexiona sobre una supervisión ética, cercana y responsable.','Comprende la diversidad y toma decisiones situadas.','Transforma los retos escolares en oportunidades de mejora.','Construye acuerdos con colegas, familias y comunidad.','Diseña tu Plan de Acompañamiento Pedagógico.'];
const icons=['☀','◇','⌂','✧','♧','▤'];const names=['María Elena Torres','Patricia López Cruz','Rosa Martínez Silva','Claudia Hernández Ruiz','Beatriz Sánchez Mora'];const zones=['12','19','20','21','22'];let role='super',person=0,page='Inicio';let db;try{db=JSON.parse(localStorage.getItem('sector04-v2'))||{}}catch(e){db={}};db.users ||= {};db.posts ||= [];const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function user(){return db.users[person] ||= {done:{},ref:{},quiz:{},plan:null}}function save(){try{localStorage.setItem('sector04-v2',JSON.stringify(db));return true}catch(e){toast('No se pudo conservar en el navegador. Exporta tu respaldo.');return false}}function toast(t){let el=document.querySelector('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',3500)}function modal(h){document.querySelector('#modalbody').innerHTML=h;document.querySelector('#modal').showModal()}function notifications(){modal('<h2>Avisos del aula</h2><p class="pill">Simulados · ciclo 2026–2027</p><p>10 de noviembre: encuentro de bienvenida.</p><p>17 de noviembre: intercambio de diagnósticos.</p><p>24 de noviembre: presentación del plan integrador.</p>')}const tasks=[['diagnostico','r0'],['quiz1','r1'],['vf','r2'],['caso','quiz3'],['foro','r4'],['plan']];function pct(u=user()){return Math.round(tasks.flat().filter(k=>u.done[k]).length/11*100)}function moduleDone(m,u=user()){return tasks[m].every(k=>u.done[k])}function complete(k){user().done[k]=true;save();updateProgress()}function updateProgress(){document.querySelectorAll('[data-count]').forEach(e=>e.textContent=Object.keys(user().done).length+' de 11 actividades completadas');document.querySelectorAll('[data-pct]').forEach(e=>e.textContent=pct()+'%');document.querySelectorAll('[data-bar]').forEach(e=>e.style.width=pct()+'%')}function illustration(){return `<svg viewBox="0 0 400 260" role="img" aria-label="Ilustración de una escuela preescolar entre árboles"><circle cx="310" cy="50" r="29" fill="#d9b66e"/><path d="M0 230Q100 165 200 215T400 195V260H0" fill="#83b7a2"/><rect x="100" y="110" width="205" height="120" rx="8" fill="#f9f5e8"/><path d="M80 115L200 40 326 115" fill="#d9b66e"/><rect x="177" y="156" width="44" height="74" rx="5" fill="#43887c"/><g fill="#8eb8cb"><rect x="122" y="140" width="33" height="34" rx="4"/><rect x="245" y="140" width="33" height="34" rx="4"/></g><g fill="#4f9580"><circle cx="48" cy="142" r="36"/><circle cx="358" cy="153" r="33"/></g><g stroke="#d6b879" stroke-width="8"><path d="M48 163v65M358 173v54"/></g><text x="200" y="110" text-anchor="middle" fill="#153f59" font-size="14" font-family="sans-serif">APRENDER EN COMUNIDAD</text></svg>`}function welcome(){app.innerHTML=`<main class="welcome"><div class="tag">Ciclo escolar 2026–2027 · Aprender para acompañar</div><div class="hero"><div><span class="pill">Jefatura de Sector 04 de Educación Preescolar</span><h1>Bienvenidas al Aula Virtual de Acompañamiento y Asesoría a Supervisoras del Sector 04.</h1><p>Este espacio ha sido diseñado para fortalecer el liderazgo pedagógico, promover la reflexión sobre la práctica de supervisión escolar y favorecer el trabajo colaborativo mediante experiencias de aprendizaje innovadoras, situadas y formativas.</p><button class="gold" onclick="login()">INGRESAR AL AULA VIRTUAL →</button></div>${illustration()}</div><div class="grid"><div class="card"><h3>06 módulos</h3><p>Una ruta para reflexionar y fortalecer la práctica.</p></div><div class="card"><h3>Aprendizaje activo</h3><p>Casos, cuestionarios y experiencias compartidas.</p></div><div class="card"><h3>Acompañamiento situado</h3><p>Un proyecto que parte del contexto escolar.</p></div></div><p>Dra. Ana Luisa Pimentel Zapata · Responsable académica</p><div class="notice">Prototipo académico. Contenidos y personas ficticios; los ejemplos no son transcripciones de perfiles ni documentos oficiales. Las interacciones se guardan únicamente en este navegador.</div></main>`}function login(){app.innerHTML=`<main style="max-width:780px"><div class="tag">Acceso demostrativo</div><h1>Elige cómo explorar el aula.</h1><p class="muted">Sin contraseña. Puedes cambiar de perfil en cualquier momento.</p><div class="profile"><h2>Supervisora escolar</h2><p>Explora módulos, participa y construye tu portafolio.</p><label for="who">Participante ficticia</label><select id="who">${names.map((n,i)=>`<option value="${i}">${n} · Zona ${zones[i]}</option>`).join('')}</select><p><button onclick="enter('super')">Entrar como participante →</button></p></div><div class="profile"><h2>Jefa de Sector · Administradora</h2><p>Dra. Ana Luisa Pimentel Zapata. Consulta el seguimiento de cinco zonas.</p><button onclick="enter('admin')">Entrar como administradora →</button></div></main>`}function enter(r){role=r;if(r==='super')person=+document.querySelector('#who').value;nav('Inicio')}function shell(content){const links=['Inicio','Módulos','Foro','Portafolio','Biblioteca','Calendario','Reconocimientos'];if(role==='admin')links.splice(1,0,'Seguimiento');app.innerHTML=`<div class="layout"><aside><div class="sideinfo"><div class="tag" style="color:#cbb782">MI ESPACIO DE APRENDIZAJE</div><h3>${role==='admin'?'Jefatura de Sector':names[person]}</h3><small>${role==='admin'?'Administradora · vista demostrativa':'Supervisora · Zona '+zones[person]}</small><hr style="opacity:.15"></div>${links.map((t,i)=>`<button class="${page===t?'active':''}" onclick="nav('${t}')">${['⌂','▦','◇','▤','▧','▣','✦','✧'][i]} &nbsp;${t}</button>`).join('')}<div class="sideinfo" style="margin-top:55px"><small>CICLO 2026–2027<br>Sector 04 · Huamantla</small><p><button class="light" onclick="download()">Exportar mi respaldo</button></p></div></aside><main><div class="row between"><span class="tag">Aula virtual / ${esc(page)}</span><span class="muted">${role==='admin'?'Vista de administración':'Zona '+zones[person]+' · Participante'}</span></div>${content}<div class="footer">Ejemplos educativos · Sector 04 Preescolar · Sin validez institucional</div></main></div>`}function progress(){return `<div class="row between"><span>Tu avance en la ruta</span><strong data-pct>${pct()}%</strong></div><div class="bar"><i data-bar style="width:${pct()}%"></i></div><small class="muted" data-count>${Object.keys(user().done).length} de 11 actividades completadas</small>`}function cards(){return `<div class="grid">${titles.map((t,i)=>`<article class="card module"><div class="num">${icons[i]} &nbsp; MÓDULO ${i} ${moduleDone(i)?'· ✓ COMPLETADO':''}</div><h3>${t}</h3><p>${desc[i]}</p><p class="muted">${tasks[i].filter(k=>user().done[k]).length} / ${tasks[i].length} actividades</p><button class="light" onclick="openModule(${i})">Explorar módulo →</button></article>`).join('')}</div>`}function nav(p){page=p;if(p==='Inicio'){if(role==='admin'){admin();return}shell(`<h1>Bienvenida, ${names[person].split(' ')[0]}.</h1><p class="muted">Cada experiencia es un paso hacia una supervisión más cercana.</p><section class="hero"><div><div class="tag" style="color:#d5bf8b">TU RUTA DE DESARROLLO PROFESIONAL</div><h2>Acompañar es aprender juntas.</h2><p>Fortalece tu liderazgo pedagógico desde la reflexión, el contexto y la colaboración.</p><button class="gold" onclick="openModule(${Math.max(0,tasks.findIndex((_,i)=>!moduleDone(i)))})">Continuar mi aprendizaje →</button></div>${illustration()}</section><div class="grid stats"><div class="card">${progress()}</div><div class="card"><strong>${titles.filter((_,i)=>moduleDone(i)).length} / 6</strong>Módulos completados</div><div class="card"><strong>${11-Object.keys(user().done).length}</strong>Actividades pendientes</div></div><div class="row between"><h2>Mis módulos de aprendizaje</h2><span class="pill">A tu propio ritmo</span></div>${cards()}`)}else if(p==='Módulos')shell(`<h1>Tu ruta de aprendizaje</h1>${progress()}${cards()}`);else if(p==='Seguimiento')admin();else if(p==='Foro')shell('<h1>Conversaciones que nos acercan</h1>'+forum());else if(p==='Portafolio')portfolio();else if(p==='Biblioteca')library();else if(p==='Calendario')calendar();else badges();window.scrollTo(0,0)}
function reflection(m,prompt){return `<div class="card"><h3>Reflexión ${m===0?'inicial':'de la práctica'}</h3><p>${prompt}</p><label for="ref${m}">Tu respuesta</label><textarea id="ref${m}" placeholder="Escribe al menos 20 caracteres…">${esc(user().ref[m]||'')}</textarea><p><button onclick="saveRef(${m})">Guardar y completar reflexión</button> <span id="rs${m}" class="muted">${user().done['r'+m]?'✓ Guardada':''}</span></p></div>`}function saveRef(m){let v=document.querySelector('#ref'+m).value.trim();if(v.length<20){toast('Desarrolla tu reflexión con al menos 20 caracteres.');return}user().ref[m]=v;complete('r'+m);document.querySelector('#rs'+m).textContent='✓ Reflexión guardada';toast('Reflexión guardada en tu portafolio')}
const quizQuestions=[['Una supervisión ética prioriza…',['Escuchar y proteger la dignidad de las personas.','Exhibir públicamente los errores.','Aplicar la misma solución a todas las escuelas.'],0,'La escucha y el trato digno permiten construir confianza.'],['Antes de proponer una mejora conviene…',['Solicitar más formatos sin propósito.','Analizar evidencias y el contexto con el colectivo.','Decidir sin consultar.'],1,'Comprender el contexto ayuda a elegir acciones pertinentes.'],['La evaluación formativa se utiliza para…',['Ordenar escuelas por resultados.','Asignar etiquetas permanentes.','Retroalimentar y ajustar la intervención.'],2,'La información se convierte en decisiones para mejorar.'],['Un acuerdo de acompañamiento requiere…',['Una meta compartida y seguimiento.','Solamente una firma.','Instrucciones sin diálogo.'],0,'Una meta común permite valorar avances con evidencias.'],['Ante información sensible corresponde…',['Compartirla en grupos abiertos.','Resguardarla y usarla con responsabilidad.','Publicarla para presionar cambios.'],1,'La confidencialidad protege a las comunidades escolares.']];function quiz(id,diagnostic=false){let qs=diagnostic?[['¿Qué orienta mejor el acompañamiento?',['Las necesidades del contexto.','Una receta universal.','Solo la entrega de documentos.'],0,'Partir de necesidades reales da sentido a la asesoría.'],...quizQuestions.slice(1)]:quizQuestions;return `<div class="card"><h3>${diagnostic?'Cuestionario diagnóstico':'Cuestionario de cinco preguntas'}</h3><p>Selecciona una respuesta por pregunta. Puedes volver a intentarlo.</p><form onsubmit="grade(event,'${id}',${diagnostic})">${qs.map((q,i)=>`<fieldset><legend>${i+1}. ${q[0]}</legend>${q[1].map((a,j)=>`<label><input required type="radio" name="q${i}" value="${j}">${a}</label>`).join('')}<div id="${id}f${i}"></div></fieldset>`).join('')}<button>Evaluar respuestas</button><div id="${id}result" aria-live="polite">${user().quiz[id]?'Último resultado: '+user().quiz[id].score+'/5':''}</div></form></div>`}function grade(e,id,d){e.preventDefault();let fd=new FormData(e.target),score=0;let qs=d?[['¿Qué orienta mejor el acompañamiento?',['Las necesidades del contexto.','Una receta universal.','Solo la entrega de documentos.'],0,'Partir de necesidades reales da sentido a la asesoría.'],...quizQuestions.slice(1)]:quizQuestions;qs.forEach((q,i)=>{let ok=+fd.get('q'+i)===q[2];score+=ok;document.querySelector('#'+id+'f'+i).innerHTML=`<div class="feedback ${ok?'':'wrong'}">${ok?'✓ Correcto':'Revisa tu respuesta'}. ${q[3]}</div>`});user().quiz[id]={score,date:new Date().toLocaleDateString('es-MX')};complete(id);document.querySelector('#'+id+'result').innerHTML=`<p class="quizresult">Resultado: ${score}/5 · ${score*20}%. Actividad completada por participación; revisa la retroalimentación.</p>`;toast('Resultado guardado')}
function openModule(m){vfAnswers={};page='Módulos';let body='';if(m===0)body=`<div class="card"><h3>Aprender desde la experiencia</h3><p>Objetivo general: fortalecer las competencias de supervisión, el liderazgo pedagógico, la contextualización curricular y la reflexión sobre la práctica mediante el acompañamiento situado.</p><p>Recorre los módulos libremente. Cada actividad guardada suma a tu avance; completar todas las actividades del módulo otorga una insignia.</p><div class="videobox"><h3>▶ Bienvenida al aula</h3><p>Recurso introductorio simulado · sin conexión a video externo</p><button class="gold" onclick="intro()">Reproducir introducción simulada</button><div id="intro"></div></div></div>${quiz('diagnostico',true)}${reflection(0,'¿Qué fortaleza reconoces en tu supervisión y qué te gustaría mejorar?')}`;
if(m===1)body=`<div class="card"><h3>La identidad de quien acompaña</h3><p>La supervisión pedagógica escucha, reconoce saberes y construye acuerdos. La ética se expresa en el trato digno, la confidencialidad, la equidad y la responsabilidad sobre las decisiones.</p><div class="grid"><div class="notice">① Escuchar<br>Comprender antes de orientar.</div><div class="notice">② Dialogar<br>Construir acuerdos con respeto.</div><div class="notice">③ Acompañar<br>Dar seguimiento con evidencias.</div></div></div>${quiz('quiz1')}${reflection(1,'Una directora comparte una dificultad de una docente y pide comentarla en un grupo abierto. ¿Cómo protegerías la confidencialidad sin dejar de acompañar?')}`;
if(m===2)body=`<div class="card"><h3>Leer el contexto para tomar decisiones</h3><p>Diagnóstico socioeducativo ficticio · Zona ${zones[person]}. Tres jardines, 180 niñas y niños; algunas familias trabajan por turnos. El colectivo observa asistencia irregular y poca participación en reuniones matutinas.</p><p>Las entrevistas muestran interés de las familias y dificultad con los horarios. Se propone diversificar los canales de comunicación, escuchar a las familias y valorar cambios de asistencia durante cuatro semanas.</p><h3>Verdadero o falso</h3>${['El contexto debe orientar las estrategias de acompañamiento.','La ausencia a una reunión siempre significa desinterés.','Un diagnóstico puede enriquecerse con la voz de las familias.'].map((s,i)=>`<fieldset><legend>${s}</legend><button class="light" onclick="vf(${i},true)">Verdadero</button> <button class="light" onclick="vf(${i},false)">Falso</button><div id="vf${i}" aria-live="polite"></div></fieldset>`).join('')}</div>${reflection(2,'¿Qué información adicional solicitarías y qué conclusión inicial compartirías con el colectivo?')}`;
if(m===3)body=`<div class="card"><h3>Una asesoría que construye capacidades</h3><p>Observación acordada, diálogo reflexivo, modelado entre pares y seguimiento breve son estrategias para acompañar. Define con el colectivo una necesidad concreta, una acción viable y una evidencia para revisar sus efectos.</p><h3>Caso: la directora Laura</h3><p>Laura detecta que las planeaciones incluyen muchas fichas y pocas oportunidades de juego. El equipo teme ser juzgado. ¿Cómo iniciarías el acompañamiento?</p>${['Exigir que todas cambien su planeación para mañana.','Observar una experiencia, dialogar y acordar una mejora pequeña.','Entregar una planeación única para toda la zona.'].map((s,i)=>`<p><button class="light" onclick="decision(${i})">${i+1}. ${s}</button></p>`).join('')}<div id="caseFeedback" aria-live="polite"></div></div>${quiz('quiz3')}`;
if(m===4)body=`<div class="card"><h3>Una comunidad que aprende</h3><p>El trabajo colegiado requiere preguntas compartidas, escucha y acuerdos revisables. Las familias aportan conocimientos sobre la vida cotidiana de las niñas y los niños. Una comunidad de aprendizaje transforma esos saberes en acciones inclusivas.</p><p>Propuesta colaborativa simulada: organiza una conversación con horarios flexibles y construye un acuerdo sobre cómo compartir avances.</p></div>${forum()}${reflection(4,'Lee la aportación de tu colega ficticia. ¿Qué retomarías y cómo construirías un acuerdo con las familias?')}`;
if(m===5)body=planForm();shell(`<button class="light" onclick="nav('Módulos')">← Todos los módulos</button><p class="tag">Módulo ${m} · ${moduleDone(m)?'Completado':'En tu propia ruta'}</p><h1>${titles[m]}</h1><p class="muted">${desc[m]}</p>${progress()}<div class="notice">Contenido de ejemplo para una demostración académica.</div><div class="stack">${body}</div><div class="row between"><button class="light" onclick="nav('Portafolio')">Consultar evidencias guardadas</button>${m<5?`<button onclick="openModule(${m+1})">Siguiente módulo →</button>`:'<button onclick="nav(\'Reconocimientos\')">Ver reconocimientos ✦</button>'}</div>`);window.scrollTo(0,0)}function intro(){document.querySelector('#intro').innerHTML='<p>Bienvenida. Primero reflexiona sobre tu práctica; después explora casos situados, comparte ideas y elabora un plan. El avance se guarda en este navegador. ¡Comencemos!</p><span class="pill">✓ Introducción simulada finalizada</span>'}
let vfAnswers={};function vf(i,a){const right=[true,false,true];vfAnswers[i]=a;document.querySelector('#vf'+i).innerHTML=`<div class="feedback ${a===right[i]?'':'wrong'}">${a===right[i]?'✓ Correcto.':'Revisa esta idea.'} ${['Las necesidades y fortalezas del contexto orientan las decisiones.','Escuchar a las familias permite conocer las barreras de participación.','La participación de las familias amplía la comprensión del contexto.'][i]}</div>`;if(Object.keys(vfAnswers).length===3){user().quiz.vf={answers:vfAnswers,score:Object.keys(vfAnswers).filter(k=>vfAnswers[k]===right[k]).length};complete('vf');toast('Actividad de verdadero o falso guardada')}}function decision(i){const texts=['Puede provocar resistencia y cambios superficiales. Conviene abrir un diálogo y acordar una meta alcanzable.','Favorece la confianza y la reflexión sobre evidencias. Acuerden incorporar juego con una intención pedagógica y revisar lo observado.','Puede ignorar la diversidad y reducir la autonomía docente. Conviene contextualizar las propuestas con cada colectivo.'];user().quiz.caso={choice:i,consequence:texts[i]};complete('caso');document.querySelector('#caseFeedback').innerHTML=`<div class="feedback"><strong>Consecuencia pedagógica</strong><p>${texts[i]}</p><small>Decisión registrada. Puedes comparar las tres opciones.</small></div>`}
function forum(){return `<div class="card"><span class="pill">Foro simulado · se conserva en este navegador</span><h3>¿Cómo acercar a las familias a la vida escolar?</h3><div class="comment"><strong>Patricia · aportación ficticia</strong><p>Probamos encuentros breves en distintos horarios. Escuchar primero nos ayudó a acordar formas de participación más accesibles.</p></div>${db.posts.map(p=>`<div class="comment"><strong>${esc(p.name)} · Zona ${esc(p.zone)}</strong><small class="muted"> · ${esc(p.date)}</small><p class="checks">${esc(p.text)}</p></div>`).join('')}<form onsubmit="post(event)"><label for="comment">Comparte una experiencia o propuesta</label><textarea id="comment" required minlength="10" placeholder="Escribe al menos 10 caracteres"></textarea><p><button>Publicar comentario</button></p></form></div>`}function post(e){e.preventDefault();let v=document.querySelector('#comment').value.trim();if(v.length<10){toast('Escribe al menos 10 caracteres.');return}db.posts.push({name:role==='admin'?'Dra. Ana Luisa Pimentel Zapata':names[person],zone:role==='admin'?'Sector 04':zones[person],text:v,date:new Date().toLocaleString('es-MX')});if(role==='super')complete('foro');else save();if(page==='Foro')nav('Foro');else openModule(4);toast('Comentario publicado en el foro simulado')}
const fields=['Zona escolar','Necesidad identificada','Objetivo','Estrategias de acompañamiento','Acciones','Evidencias','Evaluación de los avances'];function planForm(){let p=user().plan||{};return `<div class="card"><h3>Mi Plan de Acompañamiento Pedagógico</h3><p>Ejemplo: fortalecer el uso del juego mediante observación entre pares, acuerdos y revisión de evidencias durante cuatro semanas.</p><form onsubmit="savePlan(event)">${fields.map((f,i)=>`<label for="p${i}">${f}</label>${i===0?`<select id="p0" name="p0">${zones.map(z=>`<option ${String(p[0]||zones[person])===z?'selected':''}>${z}</option>`).join('')}</select>`:`<textarea id="p${i}" name="p${i}" required minlength="10" placeholder="Describe ${f.toLowerCase()}…">${esc(p[i]||'')}</textarea>`}`).join('')}<p><button>Guardar y visualizar mi plan</button></p></form><div id="savedplan">${user().plan?planView(user().plan):''}</div></div>`}function planView(p){return `<article><h3>Plan de acompañamiento · Zona ${esc(p[0])}</h3>${fields.slice(1).map((f,i)=>`<h4>${f}</h4><p class="checks">${esc(p[i+1])}</p>`).join('')}<span class="pill">Evidencia guardada · proyecto integrador</span></article>`}function savePlan(e){e.preventDefault();let fd=new FormData(e.target),p={};for(let i=0;i<7;i++){p[i]=fd.get('p'+i).trim();if(i&&p[i].length<10){toast('Desarrolla cada campo con al menos 10 caracteres.');return}}user().plan=p;complete('plan');document.querySelector('#savedplan').innerHTML=planView(p);document.querySelector('#savedplan').scrollIntoView({behavior:'smooth'});toast('Plan guardado en el portafolio')}
function portfolio(){let u=user();shell(`<h1>Mi portafolio digital</h1><p class="muted">Evidencias de ${names[person]} · Zona ${zones[person]}</p><button onclick="download()">Descargar respaldo de mis evidencias</button><div class="grid"><div class="card"><h3>Reflexiones</h3>${Object.keys(u.ref).length?Object.entries(u.ref).map(([m,v])=>`<h4>Módulo ${m}</h4><p class="checks">${esc(v)}</p>`).join(''):'<p>Aún no hay reflexiones guardadas.</p>'}</div><div class="card"><h3>Actividades y resultados</h3>${Object.entries(u.quiz).map(([k,v])=>`<p><strong>${esc({diagnostico:'Diagnóstico',quiz1:'Cuestionario de ética',quiz3:'Cuestionario de acompañamiento',vf:'Verdadero o falso',caso:'Caso de Laura'}[k])}</strong><br>${v.score!==undefined?v.score+'/'+(k==='vf'?3:5):esc(v.consequence)}</p>`).join('')||'<p>Tus resultados aparecerán aquí.</p>'}</div><div class="card"><h3>Participación en el foro</h3>${db.posts.filter(p=>p.name===names[person]).map(p=>`<p class="checks">${esc(p.text)}</p>`).join('')||'<p>Aún no has publicado.</p>'}</div></div><div class="card">${u.plan?planView(u.plan):'<h3>Proyecto integrador pendiente</h3><p>Elabora tu plan en el módulo 5.</p><button onclick="openModule(5)">Crear mi plan</button>'}</div>`)}function download(){let u=user();let data={participante:names[person],zona:zones[person],progreso:pct(),evidencias:u,foro:db.posts.filter(p=>p.name===names[person])};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Respaldo_Sector04_Zona'+zones[person]+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const resources=[['Nueva Escuela Mexicana','Relaciona el aprendizaje con la comunidad, el reconocimiento de la diversidad y el bienestar de las personas.','Explora ejemplos de proyectos comunitarios y reflexiona sobre su pertinencia.'],['Liderazgo pedagógico','Orienta los esfuerzos colectivos hacia el aprendizaje y el desarrollo profesional.','Consulta experiencias de observación entre pares y diálogo reflexivo.'],['Evaluación formativa','Recoge e interpreta evidencias para retroalimentar y ajustar las experiencias de aprendizaje.','Diseña preguntas de retroalimentación y registros de observación breves.'],['Programa Analítico','Contextualiza la enseñanza a partir de una lectura compartida de la realidad.','Compara ejemplos ficticios de contextualización y acuerdos del colectivo.'],['Consejo Técnico Escolar','Espacio de diálogo profesional y construcción de acuerdos para la mejora.','Prepara una agenda centrada en un problema pedagógico concreto.'],['Asesoría y acompañamiento','Construye capacidades con escucha, acuerdos, observación y seguimiento.','Elabora una guía de conversación posterior a una visita.'],['Cultura de paz','Promueve la convivencia, el diálogo y la resolución respetuosa de conflictos.','Analiza situaciones de mediación y acuerdos de convivencia.'],['Inclusión educativa','Identifica barreras para el aprendizaje y la participación y propone apoyos pertinentes.','Revisa ejemplos de accesibilidad y participación de todas las familias.']];function library(){shell(`<h1>Biblioteca de recursos pedagógicos</h1><p class="muted">Ideas para consultar, dialogar y llevar a la práctica. Recursos ilustrativos, sin archivos externos.</p><div class="grid">${resources.map((r,i)=>`<div class="card module"><div class="num">▧ RECURSO ${i+1}</div><h3>${r[0]}</h3><p>${r[1]}</p><button class="light" onclick="resource(${i})">Abrir recurso →</button></div>`).join('')}</div>`)}function resource(i){let r=resources[i];modal(`<span class="pill">Ficha educativa de ejemplo</span><h2>${r[0]}</h2><p>${r[1]}</p><h3>Propuesta de consulta</h3><p>${r[2]}</p><p class="muted">Esta ficha es orientativa y no reproduce documentos oficiales.</p>`)}function calendar(){shell(`<h1>Calendario de aprendizaje</h1><p class="muted">Noviembre de 2026 · agenda ilustrativa</p><div class="two"><div class="card"><div class="calendar">${['L','M','M','J','V','S','D'].map(d=>`<strong style="text-align:center">${d}</strong>`).join('')}${'<span></span>'.repeat(6)}${Array.from({length:30},(_,i)=>`<${[10,17,24].includes(i+1)?'button':'div'} class="day ${[10,17,24].includes(i+1)?'event':''}" ${[10,17,24].includes(i+1)?`onclick="calendarEvent(${i+1})" aria-label="Ver actividad del ${i+1} de noviembre"`:''}>${i+1}</${[10,17,24].includes(i+1)?'button':'div'}>`).join('')}</div></div><div class="card"><h3>Próximas experiencias</h3><p>10 NOV · Bienvenida y diagnóstico</p><p>17 NOV · Diálogo sobre contextos escolares</p><p>24 NOV · Presentación del plan integrador</p><small>Haz clic en un día resaltado para ver su actividad.</small></div></div>`)}function calendarEvent(d){modal(`<h2>${d} de noviembre de 2026</h2><p>${{10:'Encuentro de bienvenida · Explora el módulo 0 y guarda tu reflexión inicial.',17:'Intercambio de diagnósticos · Revisa el caso del módulo 2 y participa en el foro.',24:'Presentación de proyectos · Completa tu Plan de Acompañamiento en el módulo 5.'}[d]}</p><span class="pill">Evento ilustrativo · sin convocatoria real</span>`)}function badges(){shell(`<h1>Reconocimientos a tu recorrido</h1><p class="muted">Cada insignia se activa al completar todas las actividades de su módulo.</p><div class="grid">${titles.map((t,i)=>`<div class="card" style="opacity:${moduleDone(i)?1:.65}"><div class="badge">${moduleDone(i)?'🏅':'◇'}</div><span class="pill">${moduleDone(i)?'Insignia obtenida':'Por obtener'}</span><h3 style="margin-top:15px">${['Primeros pasos','Supervisión ética','Mirada contextual','Acompañamiento reflexivo','Comunidad que aprende','Diseñadora de acompañamiento'][i]}</h3><p>Módulo ${i} · ${t}</p><button class="light" onclick="openModule(${i})">${moduleDone(i)?'Revisar módulo':'Continuar actividades'}</button></div>`).join('')}</div><div class="notice">Reconocimientos demostrativos, sin valor de certificación oficial.</div>`)}
function stats(i){let u=db.users[i];if(u)return {p:pct(u),a:Object.keys(u.done).length,e:Object.keys(u.ref).length+(u.plan?1:0),posts:db.posts.filter(p=>p.name===names[i]).length,real:true};return [{p:73,a:8,e:4,posts:3},{p:55,a:6,e:3,posts:2},{p:91,a:10,e:5,posts:4},{p:36,a:4,e:2,posts:1},{p:64,a:7,e:3,posts:2}][i]}function admin(){let ss=names.map((_,i)=>stats(i));shell(`<h1>Acompañar cada trayectoria.</h1><p class="muted">Dra. Ana Luisa Pimentel Zapata · Jefatura de Sector 04</p><div class="notice">Tablero demostrativo. Las filas sin actividad local muestran datos simulados; las filas exploradas reflejan lo guardado en este navegador.</div><div class="grid stats"><div class="card"><strong>5</strong>Supervisoras · zonas 12, 19, 20, 21 y 22</div><div class="card"><strong>${Math.round(ss.reduce((s,v)=>s+v.p,0)/5)}%</strong>Avance promedio</div><div class="card"><strong>${ss.reduce((s,v)=>s+v.e,0)}</strong>Evidencias en el tablero</div></div><div class="card tablewrap"><h3>Seguimiento de las supervisoras</h3><table><thead><tr><th>Supervisora / zona</th><th>Avance</th><th>Completadas</th><th>Evidencias</th><th>Pendientes</th><th>Detalle</th></tr></thead><tbody>${names.map((n,i)=>{let s=stats(i);return `<tr><td><strong>${n}</strong><br><small>Zona ${zones[i]} · ${s.real?'Datos de esta demostración':'Simulados'}</small></td><td>${s.p}%<div class="bar"><i style="width:${s.p}%"></i></div></td><td>${s.a}/11</td><td>${s.e}</td><td>${11-s.a}</td><td><button class="light" onclick="individual(${i})">Ver seguimiento</button></td></tr>`}).join('')}</tbody></table></div><div class="card" style="margin-top:20px"><h3>Resumen de participación</h3><p>${ss.reduce((s,v)=>s+(v.posts||0),0)} aportaciones de foro representadas en el tablero. Prioridad de acompañamiento: dialogar con quienes presentan actividades pendientes y acordar apoyos específicos.</p></div>`)}function individual(i){let s=stats(i),u=db.users[i];modal(`<span class="pill">${s.real?'Actividad local de demostración':'Datos simulados'}</span><h2>${names[i]} · Zona ${zones[i]}</h2><p>Avance: ${s.p}% · ${s.a}/11 actividades · ${s.e} evidencias · ${11-s.a} pendientes.</p>${u?`<h3>Pendientes</h3><p>${tasks.flat().filter(k=>!u.done[k]).map(k=>({diagnostico:'Diagnóstico',r0:'Reflexión inicial',quiz1:'Cuestionario ético',r1:'Reflexión ética',vf:'Verdadero o falso',r2:'Conclusiones del contexto',caso:'Caso de Laura',quiz3:'Cuestionario de acompañamiento',foro:'Participación en el foro',r4:'Reflexión colaborativa',plan:'Plan integrador'}[k])).join(', ')||'¡Todas las actividades completas!'}</p><h3>Evidencias</h3>${Object.entries(u.ref).map(([m,v])=>`<p><strong>Reflexión ${m}:</strong> ${esc(v)}</p>`).join('')}${u.plan?planView(u.plan):'<p>Plan integrador aún pendiente.</p>'}`:'<h3>Ejemplo de seguimiento</h3><p>Actividad reciente: reflexión sobre el contexto escolar. Próximo acuerdo: revisar evidencias del acompañamiento y elaborar el plan integrador.</p>'}`)}welcome();
</script></body></html>
